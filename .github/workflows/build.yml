name: Native GUI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: astra918sdr-gui
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASTRA_FIRMWARE_REPOSITORY || format('{0}/astra918sdr', github.repository_owner) }}
          ref: ${{ vars.ASTRA_FIRMWARE_REF || 'main' }}
          path: astra918sdr
      - uses: dtolnay/rust-toolchain@1.90.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - run: cargo test --locked
        working-directory: astra918sdr-gui
      - run: cargo build --locked --release
        working-directory: astra918sdr-gui
      - name: Package Unix executable
        if: runner.os != 'Windows'
        run: tar -czf astra918sdr-gui/target/release/astra918-gui-${{ runner.os }}-${{ runner.arch }}.tar.gz -C astra918sdr-gui/target/release astra918-gui
      - uses: actions/upload-artifact@v4
        with:
          name: astra918-gui-${{ runner.os }}-${{ runner.arch }}
          path: |
            astra918sdr-gui/target/release/astra918-gui-${{ runner.os }}-${{ runner.arch }}.tar.gz
            astra918sdr-gui/target/release/astra918-gui.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: astra918-gui-*
          path: release-assets
          merge-multiple: true
      - name: Publish binaries to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release-assets/astra918-gui.exe release-assets/astra918-gui-Windows-X64.exe
          test -s release-assets/astra918-gui-Windows-X64.exe
          test -s release-assets/astra918-gui-Linux-X64.tar.gz
          test -s release-assets/astra918-gui-macOS-ARM64.tar.gz
          tag="build-$GITHUB_SHA"
          assets=(release-assets/astra918-gui-Windows-X64.exe
                  release-assets/astra918-gui-Linux-X64.tar.gz
                  release-assets/astra918-gui-macOS-ARM64.tar.gz)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Astra918 GUI build ${GITHUB_SHA:0:12}" \
              --notes "Windows x64, Linux x64, and macOS ARM64 GUI binaries built from commit $GITHUB_SHA." \
              --latest
          fi
