name: Native GUI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, arch: X64, runtime: x86_64}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, arch: ARM64, runtime: aarch64}
          - {runner: ubuntu-24.04, target: riscv64gc-unknown-linux-gnu, arch: RISCV64, runtime: riscv64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {path: astra918sdr-gui}
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASTRA_FIRMWARE_REPOSITORY || format('{0}/astra918sdr', github.repository_owner) }}
          ref: ${{ vars.ASTRA_FIRMWARE_REF || 'main' }}
          path: astra918sdr
      - uses: dtolnay/rust-toolchain@1.90.0
        with: {targets: "${{ matrix.target }}"}
      - name: Install native Linux dependencies
        if: matrix.arch != 'RISCV64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Install RISC-V cross dependencies
        if: matrix.arch == 'RISCV64'
        run: bash astra918sdr-gui/.github/scripts/setup-riscv.sh
      - name: Test native GUI
        if: matrix.arch != 'RISCV64'
        run: cargo test --locked
        working-directory: astra918sdr-gui
      - name: Build Linux GUI
        run: cargo build --locked --release --target ${{ matrix.target }}
        working-directory: astra918sdr-gui
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_LIBDIR_riscv64gc_unknown_linux_gnu: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR_riscv64gc_unknown_linux_gnu: /
      - name: Package tarball and AppImage
        run: bash astra918sdr-gui/.github/scripts/package-linux.sh '${{ matrix.target }}' '${{ matrix.arch }}' '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: astra918-gui-Linux-${{ matrix.arch }}
          path: |
            astra918sdr-gui/dist/*.tar.gz
            astra918sdr-gui/dist/*.AppImage
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: astra918sdr-gui}
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASTRA_FIRMWARE_REPOSITORY || format('{0}/astra918sdr', github.repository_owner) }}
          ref: ${{ vars.ASTRA_FIRMWARE_REF || 'main' }}
          path: astra918sdr
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo test --locked
        working-directory: astra918sdr-gui
      - run: cargo build --locked --release
        working-directory: astra918sdr-gui
      - run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/astra918-gui.exe dist/astra918-gui-Windows-X64.exe
        working-directory: astra918sdr-gui
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: astra918-gui-Windows-X64
          path: astra918sdr-gui/dist/*.exe
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: astra918sdr-gui}
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASTRA_FIRMWARE_REPOSITORY || format('{0}/astra918sdr', github.repository_owner) }}
          ref: ${{ vars.ASTRA_FIRMWARE_REF || 'main' }}
          path: astra918sdr
      - uses: dtolnay/rust-toolchain@1.90.0
        with: {targets: "aarch64-apple-darwin,x86_64-apple-darwin"}
      - run: cargo test --locked
        working-directory: astra918sdr-gui
      - run: cargo build --locked --release --target aarch64-apple-darwin
        working-directory: astra918sdr-gui
      - run: cargo build --locked --release --target x86_64-apple-darwin
        working-directory: astra918sdr-gui
      - name: Package universal DMG
        run: bash astra918sdr-gui/.github/scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: astra918-gui-macOS-Universal
          path: astra918sdr-gui/dist/*.dmg
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: astra918-gui-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for arch in X64 ARM64 RISCV64; do
            test -s "release-assets/astra918-gui-Linux-${arch}.tar.gz"
            test -s "release-assets/astra918-gui-Linux-${arch}.AppImage"
          done
          test -s release-assets/astra918-gui-Windows-X64.exe
          test -s release-assets/astra918-gui-macOS-Universal.dmg
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Astra918 GUI build ${GITHUB_SHA:0:12}" \
              --notes "Windows x64, macOS universal (ARM64 and x64), and Linux x64/ARM64/RISC-V 64 builds. Each Linux build is available as a tar.gz and AppImage." \
              --latest
          fi
